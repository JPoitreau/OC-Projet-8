# This workflow will install Python dependencies, run lint and test with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
name: CI
#----------------
on: # l'évènement auquel va se lancer le pipelin
  pull_request:
    branches: ["main", "prod", "dev"]

#----
jobs: # On définit ensuite les différentes tâches qui vont être faites
  quality: # Je défini d'abord ici une tâche de vérification de la qualité du code avec flake8
    runs-on: windows-latest # On définit ici le type de machine sur lequel l'environnement virtuel va tourné

    steps:

    - uses: actions/checkout@v4 # On récupère le code
      with:
        lfs: false    #Active git lfs et force le téléchargement du modèle lfs pendant le checkout

    - name: Set up Python 3.10
      uses: actions/setup-python@v5 # On installe python
      with:
        python-version: "3.10"
        cache: pip # Permet d'accélérer la mise en place de l'environnement aux jobs suivants

    - name: Install dependencies # On installe les dépendances
      run: |
        python -m pip install --upgrade pip 
        pip install ruff

    - name: Lint with ruff # configuration dans pyproject.toml
      run: ruff check .
  #----
  tests: # Puis une tâche de tests unitaires avec pytest 
         # On utilise uv pour gérer l'envt et lancer les commande.
      runs-on: windows-latest
      needs: quality
      timeout-minutes: 15

      steps:

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.31"

      - name: Set up Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --locked
      
      - name: Show environment
        run: |
          uv run python --version
          uv run python -c "import sys; print(sys.executable)"
          uv pip freeze
          uv run pytest --version
          uv run pytest --trace-config

      - name: Test with pytest
        timeout-minutes: 5
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --locked pytest -vv -s --tb=long --full-trace -o faulthandler_timeout=60
